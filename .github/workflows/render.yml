name: Render weekly video
on:
  push:
    paths: ["manifests/*.json"]
  workflow_dispatch:
    inputs:
      manifest:
        description: "Path to manifest (e.g. manifests/2026-10-25.json)"
        required: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Pick manifest
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.manifest }}" ]; then M="${{ github.event.inputs.manifest }}";
          else M=$(git diff --name-only HEAD~1 HEAD -- manifests/ | grep '\.json$' | tail -1); fi
          echo "manifest=$M" >> "$GITHUB_OUTPUT"
          echo "tag=$(basename "$M" .json)" >> "$GITHUB_OUTPUT"
      - name: Render
        run: python3 render.py "${{ steps.pick.outputs.manifest }}"
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="${{ steps.pick.outputs.tag }}"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out.mp4 chapters.txt --title "Weekly video $TAG" --notes-file chapters.txt
